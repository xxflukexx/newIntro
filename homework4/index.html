<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <div class="content">
            <h1 style="text-align: center;">ฟอร์มการรับสมัครนักศึกษาใหม่</h1>
            <form action="" method="post">
                <h2>ข้อมูลส่วนตัว</h2>
                <div class="box-item">
                    <label for="">ชื่อ : </label>
                    <input type="text" placeholder="ชื่อ" required>
                </div>
                <div class="box-item">
                    <label for="">นามสกุล : </label>
                    <input type="text" placeholder="นามสกุล" required>
                </div>
                <div class="box-item">
                    <label>เพศ : </label>

                    <input type="radio" name="gender" value="ชาย" required>
                    <label>ชาย</label>
                    <input type="radio" name="gender" value="หญิง">
                    <label>หญิง</label>
                </div>
                <div class="box-item">
                    <label>ที่อยู่ : </label>
                    <textarea placeholder="กรอกที่อยู่" required></textarea>
                </div>
                <div class="box-item">
                    <label>อีเมล : </label>
                    <input type="email" placeholder="example@email.com" required>
                </div>
                <div class="box-item">
                    <label for="">เลขบัตรประชาชน : </label>
                    <input type="number" pattern="[0-9]13" placeholder="เลขบัตรประชาชน" required>
                </div>
                <div class="box-item">
                    <label for="">รูปภาพตนเอง : </label>
                    <input type="file" required>
                </div>
                <div class="box-item">
                    <label for="">น้ำหนัก : </label>
                    <input type="text" placeholder="น้ำหนัก (กก.)" min="30" max="300" required>
                </div>
                <div class="box-item">
                    <label for="">ส่วนสูง : </label>
                    <input type="text" placeholder="ส่วนสูง (ซม.)" min="80" max="300" required>
                </div>
                <div class="box-item">
                    <label for="">โทรศัพท์ : </label>
                    <input type="number" pattern="[0-9]3[0-9]{2}3[0-9]{3}4" placeholder="โทรศัพท์" required>
                </div>
                <div class="box-item">
                    <label for="">วันเกิด : </label>
                    <input type="date" required>
                </div>
                <h2>ข้อมูลการศึกษา</h2>
                <div class="box-item">
                    <label for="">สถานศึกษาเดิม : </label>
                    <input type="text" placeholder="สถานศึกษาเดิม" required>
                </div>
                <div class="box-item">
                    <label for="">วุฒิการศึกษา : </label>
                    <input type="radio" name="graduate" required>
                    <label for="">ม.3</label>
                    <input type="radio" name="graduate">
                    <label for="">ม.6</label>
                    <input type="radio" name="graduate">
                    <label for="">ปวช.</label>
                    <input type="radio" name="graduate">
                    <label for="">ปวส.</label>
                </div>
                <div class="box-item">
                    <label for="">วุฒิที่ต้องการสมัคร: </label>
                    <input type="radio" name="degree" required>
                    <label for="">อนุปริญญา</label>
                    <input type="radio" name="degree">
                    <label for="">ปริญญาตรี</label>
                </div>
                <div class="box-item">
                    <label>สาขาที่ต้องการสมัคร : </label>
                    <select required>
                        <option>-- เลือกสาขา --</option>
                        <option value="IT">IT</option>
                        <option value="ITI">ITI</option>
                        <option value="ITT">ITT</option>
                        <option value="INE">INE</option>
                        <option value="INET" selected>INET</option>
                    </select>
                </div>
                <div class="box-item">
                    <input type="reset" value="ยกเลิก">
                    <input type="submit" value="ตกลง">
                </div>
            </form>
        </div>
    </div>
</body>

</html>
